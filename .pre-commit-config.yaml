repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e05c5c0818279e5ac248ac9e954431ba58865e61  # frozen: v0.15.7
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
        args: [--exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: python -m pyright bench_runner
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
